# git-cliff config - generates the "changes since the last tag" when a Warp release is published.
#
# Design principles:
# - Main groups follow the conventional commit type (feat/fix/refactor/docs/test/build/ci/ui/perf/chore).
# - The scope is kept as a bold prefix `**(scope)**` so subsystems are easy to scan (ai/ssh/i18n/linux/...).
# - Noise such as merge commits, plain chore(release) and reverts is skipped.
# - Non-conventional commits fall into the "Other" group, so nothing is lost and the main groups stay clean.
# - Output is a bare fragment (no H1 title or date block); the workflow appends it after the intro at the top of release_body.

[changelog]
# No `# Changelog` heading at the top; the publish_release step handles overall layout.
header = ""

body = """
{%- if previous %}
{%- if previous.version %}
**Changes**: [`{{ previous.version }}` … `{{ version }}`]({{ self::compare_url(prev=previous.version, curr=version) }})

{% endif -%}
{%- endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}**({{ commit.scope }})** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}{% if commit.id %} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ self::commit_url(sha=commit.id) }})){% endif %}
{% endfor %}
{% endfor %}
{%- macro compare_url(prev, curr) -%}
https://github.com/zerx-lab/warp/compare/{{ prev }}...{{ curr }}
{%- endmacro -%}
{%- macro commit_url(sha) -%}
https://github.com/zerx-lab/warp/commit/{{ sha }}
{%- endmacro -%}
"""

# The compare footer between tags is emitted by compare_url in the template, so no extra footer is appended here.
footer = ""

trim = true

[git]
# Do not error when conventional commit parsing fails; fall into the catch-all group in commit_parsers.
conventional_commits = true
filter_unconventional = false
# Do not split multi-line bodies - one commit, one entry.
split_commits = false

# Tag naming: v prefix + any suffix (v2026.05.27.2 / v2026.05.06.preview / v2026.05.21.warptest01).
tag_pattern = "v[0-9].*"

# Order follows the commit order in git log (newest to oldest) for readability.
topo_order = false
sort_commits = "newest"

# Ignore merge / internal release tag commits that mean nothing to users.
commit_preprocessors = [
    # Strip the trailing PR number in parentheses on the first line, so `(#171)` does not duplicate the hash link below.
    # `(?m)` anchors `$` to the end of each line (the commit subject is the first line), not the end of the whole message.
    { pattern = '(?m) \(#[0-9]+\)$', replace = "" },
    # Strip the gitmoji prefix at the start of the commit subject (e.g. "♻️ refactor: ..."),
    # otherwise later group rules such as `^refactor` cannot match and the commit lands in "Other".
    { pattern = '^(♻️|✨|🐛|🎨|🚀|🔥|💄|📝|🛠|⚡|🚧|🐳|🔧|🚨|✅|♿|🔒)[️]?\s*', replace = "" },
]

# Order matters: the first match wins. Noise skips come first.
commit_parsers = [
    # Noise: skip
    { message = "^[Mm]erge ", skip = true },
    { message = "^[Rr]evert ", skip = true },
    { message = "^[Bb]ump ", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore: release", skip = true },
    { message = "^v[0-9]+\\.", skip = true },

    # Main conventional commit groups (rendered in this order)
    { message = "^feat", group = "✨ Features" },
    { message = "^fix", group = "🐛 Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "♻️ Refactoring" },
    { message = "^ui", group = "🎨 UI" },
    { message = "^style", group = "🎨 UI" },
    { message = "^test", group = "🧪 Tests" },
    { message = "^docs", group = "📝 Docs" },
    { message = "^(build|ci|chore)", group = "🛠 Build and chores" },

    # Catch-all: keep commits of any other form in the "Other" group so non-conventional commits are not missed.
    { message = ".*", group = "📦 Other" },
]
