# Warp release pipeline - triggered by pushing a tag (v*) on the openWarp branch
#
# Differences from upstream create_release.yml:
# - Only macOS arm64 + macOS Intel + Windows x64 + Linux x86_64;
#   Web/CLI/Universal/Win-arm64 are all dropped
#   (the two macOS architectures each produce a single-arch DMG and CLI tarball; Linux produces AppImage/deb/rpm
#    plus a best-effort Arch package; the upstream Warp package repo and signing key are not published)
# - Single channel: preview (config provided by release_configurations.json)
# - No signing: --read-passwords-from-env is not passed (macOS) / SIGN_TOOL_CMD is not set (Windows)
# - No upload to GCS / third-party crash platform / Slack / changelog, no channel-versions repository_dispatch
# - Reuses ./.github/actions/{prepare_environment,get_channel_config}
#
# Pipeline structure (package first, then publish, to avoid an empty Release):
#   prepare_metadata → release_{macos,windows,linux} (uploaded as workflow artifacts)
#                    → publish_release (after all builds succeed, downloads artifacts and creates the Release)
# If any build job fails → publish_release is skipped via needs → no Release without installers is left behind.

name: Warp Release

# PR validation is handled by .github/workflows/pr-check.yml (Linux cargo check).
# This workflow runs the full three-platform packaging only on push tag / manual dispatch, to avoid wasting ~3h per PR.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Creating a release + uploading assets needs write permission. The default GITHUB_TOKEN is read-only on forks/restricted repos,
# so contents: write is declared explicitly to avoid 403 "Resource not accessible by integration".
# actions: write is used at the end of publish_release to delete this run's workflow artifacts (frees Actions storage).
permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  CONFIG_FILE: ".github/workflows/release_configurations.json"
  # The Warp fork uses the oss channel (matches the inline ChannelConfig in app/src/bin/oss.rs,
  # not depending on the private warp-channel-config binary); internal channels such as preview go through the
  # channel_config::load_config!() macro → build.rs fails to call warp-channel-config →
  # *_config.json is not generated → include_str! fails to compile.
  CHANNEL: oss

jobs:
  prepare_metadata:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.compute_tag.outputs.tag }}
      release_branch: ${{ steps.compute_tag.outputs.branch }}
      release_name: ${{ steps.get-config.outputs.release_base_name }} ${{ steps.compute_tag.outputs.tag }}
    steps:
      # fetch-depth: 0 lets git-cliff see the full tag/commit history;
      # with a shallow clone `git describe` cannot find the previous tag and release notes degrade to empty.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get channel configuration
        id: get-config
        uses: ./.github/actions/get_channel_config/
        with:
          config_file: ${{ env.CONFIG_FILE }}
          channel: ${{ env.CHANNEL }}

      - name: Compute release tag and branch
        id: compute_tag
        shell: bash
        run: |
          # tag-triggered: GITHUB_REF=refs/tags/<tag>
          # workflow_dispatch: GITHUB_REF=refs/heads/<branch>, no tag, so a temporary tag is generated
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            BRANCH="$TAG"
          else
            TAG="v0.$(date +%Y.%m.%d.%H%M)"
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG / build ref: $BRANCH"

      # Find the previous release tag (matching v*) to limit the git-cliff commit range.
      # tag-triggered: HEAD == the current tag, so search for the latest v* tag starting from HEAD^.
      # dispatch: HEAD is not a tag, so search directly from HEAD.
      # If none is found (first release), output an empty string and git-cliff will not limit the range.
      - name: Compute previous release tag
        id: prev_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            PREV=$(git describe --tags --abbrev=0 --match='v*' HEAD^ 2>/dev/null || echo "")
          else
            PREV=$(git describe --tags --abbrev=0 --match='v*' HEAD 2>/dev/null || echo "")
          fi
          echo "prev=$PREV" >> $GITHUB_OUTPUT
          echo "Previous tag: ${PREV:-<none, first release>}"

      # Use the officially recommended orhun/git-cliff-action to generate the changes from the previous tag to HEAD.
      # --strip header removes the empty header at the top of the template; --tag marks the unreleased section as this release version.
      # The range argument `<prev>..HEAD` is injected via a ternary expression: with prev it limits the range, without prev
      # git-cliff outputs the full history (first release).
      - name: Generate release notes via git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: >-
            --strip header
            --tag ${{ steps.compute_tag.outputs.tag }}
            ${{ steps.prev_tag.outputs.prev != '' && format('{0}..HEAD', steps.prev_tag.outputs.prev) || '' }}
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      # Prepend the fixed note from release_configurations.json to the git-cliff output,
      # forming the final release body. publish_release later injects it into the GitHub Release via body_path.
      - name: Assemble final release body
        shell: bash
        env:
          RELEASE_BODY_TEXT: ${{ steps.get-config.outputs.release_body_text }}
          PREV_TAG: ${{ steps.prev_tag.outputs.prev }}
          THIS_TAG: ${{ steps.compute_tag.outputs.tag }}
        run: |
          {
            echo "$RELEASE_BODY_TEXT"
            echo
            if [[ -n "$PREV_TAG" ]]; then
              echo "## Changes since \`$PREV_TAG\`"
            else
              echo "## Initial release changes"
            fi
            echo
            cat release-notes.md
          } > release-body.md
          # GitHub rejects release bodies over 125000 chars
          head -c 100000 release-body.md > release-body.tmp && mv release-body.tmp release-body.md
          echo "---- release-body.md ----"
          cat release-body.md

      - name: Upload release body artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-body
          path: release-body.md
          if-no-files-found: error
          retention-days: 7

  release_macos:
    name: Build Release (macOS ${{ matrix.dmg_name_suffix }})
    runs-on: ${{ matrix.runner }}
    needs: prepare_metadata
    # macos-26 / macos-26-intel (Pro standard) have no sccache; a full cargo build + bundle + create-dmg
    # takes long; Intel builds have historically exceeded 180min, so this is relaxed to the 6h limit of GitHub-hosted jobs.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            dmg_name_suffix: arm64
            runner: macos-26 # Pro standard arm64 (M2 Pro)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare_metadata.outputs.release_branch }}

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          cache_key: macos-${{ matrix.arch }}
          is_self_hosted: false
          install_release_deps: true

      - name: Ensure rust target is installed
        run: rustup target add ${{ matrix.arch }}-apple-darwin
        shell: bash

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable

      - name: Install cargo-bundle
        run: script/install_cargo_bundle

      - name: Install create-dmg
        run: brew install create-dmg

      # Use --selfsign for ad-hoc signing (falls back to `-` when there is no Apple Developer cert):
      # 1. Gives the .app a cdhash → only then will UNUserNotificationCenter register Warp under
      #    System Settings → Notifications (otherwise desktop notifications silently fail, see issue #40).
      # 2. ad-hoc + Hardened Runtime + Debug-Entitlements.plist(disable-library-validation
      #    + get-task-allow) is a valid combination and works on the macos-26 runner without credentials.
      # 3. The whole notarize section is skipped by the CODESIGN=false branch of `script/macos/bundle`; the DMG is created
      #    directly from BUNDLE_DIR with create-dmg, skipping the codesign / staple steps.
      # 4. On first launch users still get the Gatekeeper "unidentified developer" dialog (an inherent limit without Developer ID
      #    notarization); the `xattr -rd com.apple.quarantine` workaround from issue #51
      #    remains valid.
      - name: Build ${{ matrix.arch }} bundle (ad-hoc signed)
        id: bundle_app
        run: |
          script/bundle --channel "$CHANNEL" --arch ${{ matrix.arch }} --dmg-name-suffix "${{ matrix.dmg_name_suffix }}" --selfsign
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warp-macos-${{ matrix.dmg_name_suffix }}
          path: ${{ steps.bundle_app.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 7

  release_windows:
    name: Build Release (Windows x64)
    runs-on: windows-latest
    needs: prepare_metadata
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare_metadata.outputs.release_branch }}

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          cache_key: x64
          is_self_hosted: false
          install_release_deps: true

      - name: Build binary (unsigned)
        id: build_binary
        run: script/bundle -Channel $CHANNEL -skip_build_installer --arch x64
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      - name: Bundle app (unsigned installer)
        id: bundle_app
        run: script/bundle -Channel $CHANNEL -skip_build_binary --arch x64
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warp-windows-x64
          path: ${{ steps.bundle_app.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 7

  release_linux:
    if: false  # disabled: Linux not released
    name: Build Release (Linux x86_64)
    runs-on: ubuntu-22.04
    needs: prepare_metadata
    # Use 22.04 (glibc 2.35) instead of ubuntu-latest (24.04, glibc 2.39);
    # AppImage links against the host glibc, so 22.04 output runs on more older distros
    # (Debian 11 / Ubuntu 20.04 + etc.).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare_metadata.outputs.release_branch }}

      # The / partition of GitHub-hosted ubuntu runners has limited free space, and this job produces two full targets on the same disk:
      # release-lto (GUI/AppImage/deb/rpm/arch) and then release-cli (musl CLI); together with the cargo registry / docker images / zig toolchain this
      # fills the disk and the musl CLI step fails with "No space left on device" (see run 27593938453). First remove
      # preinstalled toolchains unrelated to this build (Android SDK / .NET / GHC / CodeQL / Swift) to free ~25GB.
      - name: Free up disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false
          install_release_deps: true

      - name: Install extra dependencies for deb/rpm and build
        run: |
          sudo apt-get update
          # The `rpm` package provides /usr/bin/rpmbuild, used by the RPM packaging step below.
          sudo apt-get install -y libdbus-1-dev fakeroot rpm
        shell: bash

      - name: Ensure rust target is installed
        run: rustup target add x86_64-unknown-linux-gnu
        shell: bash

      - name: Check Linux release compile
        run: script/bundle --check-only --channel "$CHANNEL" --arch x86_64 --packages appimage,deb
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      - name: Install linuxdeploy
        # script/linux/install_linuxdeploy is not called by install_build_deps and must be run manually;
        # it puts the linuxdeploy AppImage in ~/.local/bin and adds it to PATH.
        run: |
          ./script/linux/install_linuxdeploy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Build AppImage (unsigned)
        id: bundle_app
        run: script/bundle --channel "$CHANNEL" --arch x86_64 --packages appimage,deb
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}
          # ubuntu-22.04 ships libfuse2 by default but 24.04 does not; enabling EXTRACT_AND_RUN everywhere
          # keeps linuxdeploy/appimagetool independent of the FUSE kernel module, so it is stable across runner versions.
          APPIMAGE_EXTRACT_AND_RUN: 1

      # RPM package: reuse `target/release-lto/warp`, already stripped by the previous release-lto step,
      # without running `cargo build` again. `--skip-build` makes `script/bundle` skip compilation and strip,
      # going straight to staging (`bundle_install` → copy binary + resources) + rpmbuild.
      # Runs on the same ubuntu-22.04 runner as deb, sharing the host-glibc-linked artifact;
      # install with RPM 4.13+ on Fedora 26+ / RHEL 8+ (the spec uses boolean dependency syntax).
      # continue-on-error: even if rpmbuild fails it must not block the AppImage/deb that already succeeded.
      - name: Build RPM package (reuse release-lto binary)
        continue-on-error: true
        run: script/bundle --skip-build --channel "$CHANNEL" --arch x86_64 --packages rpm
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      # Arch package: reuse `target/release-lto/warp`, already stripped by the previous release-lto step,
      # without running `cargo build` for the main binary again - `--skip-build` makes `script/bundle` skip compilation and strip,
      # going straight to staging (`bundle_install` → copy binary + resources) + makepkg.
      #
      # Why a container: `makepkg` is Arch-only and the Ubuntu runner does not have it.
      # The container only installs Arch's own `rust` and `cargo-about`:
      #   - With SKIP_SETTINGS_SCHEMA=1, `cargo run --bin generate_settings_schema` no longer runs,
      #     so it does not matter that the container's rustc version differs from the project-pinned one (1.92.x).
      #   - `cargo about generate` only reads Cargo.lock metadata to generate third-party licenses,
      #     and does not trigger any Rust code compilation.
      # makepkg refuses to run as root (EUID==0), so it must switch to a non-root user.
      # continue-on-error: an Arch toolchain failure does not affect the AppImage/deb release.
      - name: Build Arch package (reuse release-lto binary)
        continue-on-error: true
        run: |
          set -euo pipefail
          # Create the builder in the container with the host runner user's uid/gid, avoiding the cost of chown on the whole
          # /work and ~/.cargo (makepkg refuses root, but any uid != 0 works,
          # whatever the name or specific uid).
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          # Note: do not pass GITHUB_ACTIONS=true into the container.
          # When script/bundle sees this variable it runs `echo ... >> "$GITHUB_OUTPUT"`,
          # but the container has no GITHUB_OUTPUT, the redirect to an empty string triggers `set -e` and exits,
          # so the Arch package is never built (see run 26153630745).
          # We also do not need this step's step outputs - it is continue-on-error,
          # and packages_dir is provided by bundle_app.outputs from the earlier AppImage step.
          docker run --rm \
            -v "$PWD:/work" \
            -v "$HOME/.cargo:/cargo-home" \
            -w /work \
            -e GIT_RELEASE_TAG="${{ needs.prepare_metadata.outputs.release_tag }}" \
            -e SKIP_SETTINGS_SCHEMA=1 \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            archlinux:latest bash -euxc '
              # Pre-install the runtime dependencies in the PKGBUILD `depends`, so makepkg -s
              # does not call `sudo pacman -S` in the container for missing packages (builder has no passwordless sudo,
              # so it exits with 8 on being unable to read a password and the Arch package is lost, see run 26267606877).
              # `opengl-driver` does not exist in the official repos (a NixOS concept / AUR virtual package),
              # so --assume-installed is used on its own to make the dependency check skip it.
              pacman -Sy --noconfirm --needed \
                base-devel git sudo rust cargo-about \
                curl default-cursors fontconfig libegl libx11 libxcb \
                libxcursor libxi libxkbcommon-x11 xdg-utils zlib &&
              # Create the user with the host uid/gid, so the mounted /work and /cargo-home are owned by it,
              # no chown needed; sudo -u can read and write directly.
              groupadd -g "$HOST_GID" builder 2>/dev/null || true
              useradd -u "$HOST_UID" -g "$HOST_GID" -m builder
              # Set HOME=/home/builder explicitly, otherwise `sudo -E` keeps the outer HOME=/root,
              # and `git config --global` tries to write /root/.gitconfig and fails with Permission denied.
              sudo -u builder -E env \
                HOME=/home/builder \
                CARGO_HOME=/cargo-home \
                PATH=/cargo-home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin \
                bash -c "
                  git config --global --add safe.directory /work
                  cd /work
                  # Dependencies are already installed by the outer pacman; tell makepkg to treat `opengl-driver`
                  # as installed, so it does not try to pacman -S a package that is not in the repos.
                  # Also pass --noconfirm: GITHUB_ACTIONS is not passed into the container,
                  # so the native branch in bundle_arch does not take effect.
                  MAKEPKG_EXTRA_ARGS='\''--noconfirm --assume-installed opengl-driver'\'' \
                    script/bundle --skip-build --channel oss --arch x86_64 --packages arch
                "
            '
        shell: bash

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warp-linux-x86_64
          # packages_dir is target/release-lto/bundle/linux; AppImage/deb/Arch all land here
          path: ${{ steps.bundle_app.outputs.packages_dir }}
          if-no-files-found: error
          retention-days: 7

      # The release-lto artifacts (GUI/deb/rpm/arch) were already uploaded as workflow artifacts by the previous
      # "Upload package artifacts" step and are no longer needed locally; the musl CLI below uses the separate release-cli
      # profile, so delete release-lto to free disk for it and avoid "No space left on device".
      - name: Reclaim disk before musl CLI build
        shell: bash
        run: |
          rm -rf target/release-lto
          df -h /

      # The CLI/remote-server tarball is statically linked with musl, so the output does not depend on the host glibc
      # and runs on any Linux x86_64 host (including old-glibc systems such as CentOS 7 / Amazon Linux 2
      # and musl distros such as Alpine). The GUI AppImage/deb still use the glibc-linked build above
      # and are unaffected.
      #
      # Use `cargo zigbuild` for musl cross-compilation: zig ships a complete C/C++ musl
      # toolchain (`zig cc` / `zig c++`), not depending on the host's `musl-gcc` or a hand-written
      # `musl-g++` wrapper - the "host g++ + musl specs" hack historically prepared for *-sys dependencies such as freetype-sys / harfbuzz-sys
      # is therefore removed entirely.
      # The local dev auto-build path (`ssh_transport.rs`) also prefers zigbuild, so both sides
      # use the same toolchain.
      - name: Install zig + cargo-zigbuild for static musl CLI build
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          # zig: use the official prebuilt tarball, with a pinned version for reproducible builds.
          # 0.13.0 is compatible with cargo-zigbuild >= 0.19.
          ZIG_VERSION="0.13.0"
          ZIG_DIR="$HOME/.local/zig-${ZIG_VERSION}"
          if [ ! -x "${ZIG_DIR}/zig" ]; then
            mkdir -p "${ZIG_DIR}"
            curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
              | tar -xJ -C "${ZIG_DIR}" --strip-components=1
          fi
          echo "${ZIG_DIR}" >> "$GITHUB_PATH"
          # cargo-zigbuild: installed via cargo install; after the first install it is reused from the cache.
          cargo install --locked cargo-zigbuild --version ^0.19
        shell: bash

      - name: Build CLI (static musl via zigbuild)
        id: bundle_cli
        run: |
          script/bundle --channel "$CHANNEL" --arch x86_64 --artifact cli --packages none \
            --target x86_64-unknown-linux-musl
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Make script/linux/bundle switch `cargo build` to `cargo zigbuild`.
          USE_ZIGBUILD: "true"
          # libc (musl) is statically linked into the binary via +crt-static - this is the key to freeing the output
          # from the host glibc floor. `libdbus-sys` is now built from embedded source through keyring's
          # `vendored` feature (see Cargo.toml) instead of probing the host `dbus-1` with pkg-config;
          # `PKG_CONFIG_ALLOW_CROSS=1` is kept as a fallback, so if some newly introduced -sys crate still uses pkg-config
          # it will not get stuck.
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Package CLI tarball
        run: |
          cp "${{ steps.bundle_cli.outputs.executable_path }}" warp
          tar czf warp-linux-x86_64.tar.gz \
            warp \
            -C "$(dirname "${{ steps.bundle_cli.outputs.bundled_resources_dir }}")" resources
        shell: bash

      - name: Upload CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warp-cli-linux-x86_64
          path: warp-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # Publishing must wait for all platforms to build successfully; if any fails → this job is skipped → no empty Release appears.
    needs:
      - prepare_metadata
      - release_macos
      - release_windows
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # The release-body artifact is for the GitHub Release description, not an artifact to attach to the Release asset list.
      # Move it from dist/ to a separate path beforehand so `files: dist/*` does not upload it as an asset.
      - name: Extract release body from artifacts
        shell: bash
        run: |
          mv dist/release-body.md ./release-body.md
          echo "---- release-body.md ----"
          cat ./release-body.md

      - name: List downloaded files
        run: ls -lh dist
        shell: bash

      - name: Create GitHub release with all assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ needs.prepare_metadata.outputs.release_name }}
          tag_name: ${{ needs.prepare_metadata.outputs.release_tag }}
          body_path: ./release-body.md
          draft: false
          prerelease: false
          make_latest: "true"
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}

      # After a successful publish, immediately delete this run's workflow artifacts to free the Actions storage quota.
      # The installers are already attached to the GitHub Release (separate storage, not counted in Actions storage),
      # and workflow artifacts are only an intermediate pipe from build jobs to the publish job, so keeping them is useless.
      # Only runs after the Release is created successfully (if: success()); on failure the artifacts are kept for post-mortem.
      - name: Delete workflow artifacts to free Actions storage
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id')
          for id in $ids; do
            echo "Deleting artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
        shell: bash
